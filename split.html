
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split PDF - PDFMaster</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .split-container {
            max-width: 750px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .upload-area {
            border: 2px dashed #8b5cf6;
            border-radius: 12px;
            padding: 45px 20px;
            text-align: center;
            cursor: pointer;
            background: #faf8ff;
            margin: 25px 0;
        }

        .upload-area:hover {
            background: #f1ebff;
        }

        .upload-area h3 {
            color: #6d28d9;
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #666;
        }

        .file-info {
            margin: 20px 0;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 8px;
            display: none;
        }

        .range-section {
            margin: 25px 0;
        }

        .range-section label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .range-section input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .action-buttons button {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        #extractBtn {
            background: #6d28d9;
            color: white;
        }

        #extractBtn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #removeFileBtn {
            background: #dc2626;
            color: white;
            display: none;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6d28d9;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="split-container">

        <h1>Split PDF</h1>

        <p>
            Extract selected pages from your PDF and download them
            as a new PDF file.
        </p>

        <div class="upload-area" id="uploadArea">
            <h3>Upload Your PDF</h3>
            <p>Click here or drag and drop your PDF file</p>
            <input
                type="file"
                id="fileInput"
                accept=".pdf,application/pdf"
                hidden
            >
        </div>

        <div class="file-info" id="fileInfo"></div>

        <div class="range-section">
            <label for="pageRange">Enter Page Numbers or Ranges</label>

            <input
                type="text"
                id="pageRange"
                placeholder="Example: 1-3, 5, 8-10"
            >

            <small>
                Example: 1-3, 5, 8-10 extracts pages 1, 2, 3, 5, 8, 9 and 10.
            </small>
        </div>

        <div class="action-buttons">

            <button id="extractBtn" disabled>
                Extract Pages
            </button>

            <button id="removeFileBtn">
                Remove PDF
            </button>

        </div>

        <div id="message"></div>

        <a href="index.html" class="back-link">
            ← Back to PDFMaster
        </a>

    </div>

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="split.js"></script>

</body>
</html>
