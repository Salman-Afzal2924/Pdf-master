
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Page Numbers - PDFMaster</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .tool-container {
            max-width: 750px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .upload-area {
            border: 2px dashed #8b5cf6;
            border-radius: 12px;
            padding: 45px 20px;
            text-align: center;
            cursor: pointer;
            background: #faf8ff;
            margin: 25px 0;
        }

        .upload-area:hover {
            background: #f1ebff;
        }

        .upload-area h3 {
            color: #6d28d9;
        }

        .file-info {
            display: none;
            margin: 20px 0;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 8px;
        }

        .settings {
            margin: 25px 0;
        }

        .settings label {
            display: block;
            font-weight: bold;
            margin: 15px 0 8px;
        }

        .settings select,
        .settings input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .action-buttons button {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        #addNumbersBtn {
            background: #6d28d9;
            color: white;
        }

        #addNumbersBtn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #removeFileBtn {
            background: #dc2626;
            color: white;
            display: none;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6d28d9;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="tool-container">

        <h1>Add Page Numbers</h1>

        <p>
            Add page numbers to your PDF with customizable position
            and starting number.
        </p>

        <div class="upload-area" id="uploadArea">
            <h3>Upload Your PDF</h3>
            <p>Click here or drag and drop your PDF file</p>

            <input
                type="file"
                id="fileInput"
                accept=".pdf,application/pdf"
                hidden
            >
        </div>

        <div class="file-info" id="fileInfo"></div>

        <div class="settings">

            <label for="position">Number Position</label>

            <select id="position">
                <option value="bottom-center">Bottom Center</option>
                <option value="bottom-left">Bottom Left</option>
                <option value="bottom-right">Bottom Right</option>
                <option value="top-center">Top Center</option>
                <option value="top-left">Top Left</option>
                <option value="top-right">Top Right</option>
            </select>

            <label for="startNumber">Starting Number</label>

            <input
                type="number"
                id="startNumber"
                min="1"
                value="1"
            >

            <label for="fontSize">Font Size</label>

            <select id="fontSize">
                <option value="10">Small</option>
                <option value="12" selected>Medium</option>
                <option value="16">Large</option>
                <option value="20">Extra Large</option>
            </select>

        </div>

        <div class="action-buttons">

            <button id="addNumbersBtn" disabled>
                Add Page Numbers
            </button>

            <button id="removeFileBtn">
                Remove PDF
            </button>

        </div>

        <div id="message"></div>

        <a href="index.html" class="back-link">
            ← Back to PDFMaster
        </a>

    </main>

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="page-numbers.js"></script>

</body>
</html>
